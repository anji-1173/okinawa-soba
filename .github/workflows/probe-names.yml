name: cf-probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: check verification tags on the Cloudflare site
        run: |
          B=https://okinawa-soba.apps-okinawa.workers.dev
          curl -s -o /dev/null -w "top: %{http_code}\n" "$B/"
          curl -s "$B/" | grep -o '<meta name="google-site-verification"[^>]*>'
          curl -s "$B/" | grep -o "APP_VERSION = '[^']*'"
