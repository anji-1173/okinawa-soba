name: i18n-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: webkit iPhone test
        run: |
          mkdir -p probe t && cd t && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps webkit chromium >/dev/null
          curl -s -o /dev/null -w "translate.goog top: %{http_code}\n" "https://anji--1173-github-io.translate.goog/okinawa-soba/?_x_tr_sl=ja&_x_tr_tl=en&_x_tr_hl=en" | tee -a ../probe/log.txt
          curl -s -o /dev/null -w "translate.goog index.html: %{http_code}\n" "https://anji--1173-github-io.translate.goog/okinawa-soba/index.html?_x_tr_sl=ja&_x_tr_tl=en&_x_tr_hl=en" | tee -a ../probe/log.txt
          curl -s -o /dev/null -w "element.js: %{http_code}\n" "https://translate.google.com/translate_a/element.js?cb=x" | tee -a ../probe/log.txt
          cat > t.mjs <<'JS'
          import { webkit, chromium, devices } from 'playwright';
          import fs from 'fs';
          const log = s => { console.log(s); fs.appendFileSync('../probe/log.txt', s+'\n'); };
          for (const [name, bt, dev] of [['webkit-iphone', webkit, devices['iPhone 13']], ['chromium-iphone', chromium, devices['iPhone 13']]]) {
            const b = await bt.launch();
            const ctx = await b.newContext({ ...dev, locale:'ja-JP' });
            await ctx.addCookies([{name:'googtrans', value:'/ja/en', domain:'anji-1173.github.io', path:'/'}]);
            const p = await ctx.newPage();
            p.on('console', m => log(name+' console: '+m.text().slice(0,200)));
            p.on('pageerror', e => log(name+' pageerror: '+e.message.slice(0,200)));
            p.on('requestfailed', r => log(name+' reqfail: '+r.url().slice(0,120)+' '+(r.failure()&&r.failure().errorText)));
            p.on('response', r => { if (/translate/.test(r.url())) log(name+' resp: '+r.status()+' '+r.url().slice(0,140)); });
            await p.goto('https://anji-1173.github.io/okinawa-soba/', {waitUntil:'load'});
            await p.waitForTimeout(12000);
            log(name+' gt='+await p.evaluate(()=>!!(window.google&&google.translate&&google.translate.TranslateElement))+' note='+await p.$eval('#i18n-note',e=>e.innerText+' -> '+e.querySelector('a').href).catch(()=>'none'));
            log(name+' sample: '+(await p.$eval('body', e=>e.innerText)).slice(0,300).replace(/\n/g,' / '));
            await p.screenshot({path:'../probe/'+name+'.png'});
            await b.close();
          }
          JS
          node t.mjs || true
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add probe && git commit -m "i18n probe [skip ci]" && git push
