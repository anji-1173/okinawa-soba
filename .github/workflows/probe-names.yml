name: probe-names
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          sudo apt-get install -y -qq libimage-exiftool-perl >/dev/null 2>&1 || true
          mkdir -p probe
          i=1
          for u in c09be021-521e-4267-881f-ffb762fe89b3 40aad5f1-761d-4db3-afc7-87af1307e788 4af77f74-ad07-4a39-8e8c-e5ae4d3e7908 20c8d29b-cafb-4757-b91f-2378eaa7bab9 5d42ffdb-ec5c-4ada-a137-bab1a22b10dc ea9f011d-bb5c-4868-8b5b-acd76e4c8d1c 24d0e0a7-a0a7-4e65-9b00-8c0669cefcd9 304bc2c2-09fe-46e2-9d23-60e15ccd7c03 c5e6b527-8a72-4c22-9f29-5ce74962b28f 1831cf4c-55dd-4295-a015-5a18221d1475 415a85e9-cbac-4082-86fd-673c404d2c7a; do
            n=$(printf %02d $i)
            echo "=== $n $u" >> probe/headers.txt
            curl -sIL "https://github.com/user-attachments/assets/$u" | grep -iE '^(HTTP|location|content-disposition|content-type|last-modified|x-amz)' >> probe/headers.txt
            curl -sL "https://github.com/user-attachments/assets/$u" -o probe/$n.jpg
            echo "=== $n" >> probe/exif.txt
            exiftool -s -FileName -DateTimeOriginal -CreateDate -ModifyDate -SubSecTimeOriginal -ImageUniqueID -Model probe/$n.jpg >> probe/exif.txt 2>&1
            i=$((i+1))
          done
          rm -f probe/*.jpg
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add probe
          git commit -m "probe [skip ci]"
          git push
