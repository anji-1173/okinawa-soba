# 使い方:
#   1. このファイルを .github/workflows/fetch-assets.yml としてリポジトリにコピーする
#   2. 9b76aacb-b953-4f33-b6d6-e14225bcfd29 27d74d7c-77b7-4021-b6d1-931d9f05438a 1097ce0a-f38c-428a-b492-7b66c8c80cac 5ef466d4-3085-4090-90de-a817a3ab19d4 273f2fa8-0c6f-4f65-89d6-5ee649dcf18a 084e9cb4-c936-487e-823b-af281e29e149 03863cc3-9c1b-49c9-9aee-a85143f99561 7b277934-cc99-4844-8a47-d753b26ba3fd f3b21c9f-bbd2-4ac6-a3fb-9e0f2d322497 d8d8991a-35a9-4152-9a38-f49c63eb10f1 9b6596ca-a92b-45c3-9e13-17aae1f1d85b 070b6929-1250-4a87-95ed-f5f0619048da 81fd88c5-42d4-4f68-81e4-003eea94c129 e1475913-9e5f-4ae1-9a13-0f53acb71677 e4844a24-57e4-4912-9708-43019c077811 fc034b4a-026a-4135-84b9-7364013c15e1 04182ed3-49c9-4f76-8c84-f5b55ebbb7e8 を、Issue本文/コメントから抽出した
#      github.com/user-attachments/assets/<uuid> のUUID部分を空白区切りで並べたものに置換する
#      （例: 6e289a11-...  624c7e39-...  9764caac-...）
#   3. main にコミット＆プッシュ
#   4. mcp__github__actions_run_trigger の run_workflow で実行（workflow_id: fetch-assets.yml）
#   5. 数十秒待ってから `git pull` すると incoming/01.jpg, 02.jpg... が届く
#   6. 使い終わったら incoming/ とこのファイル自体を git rm してコミットし、後片付けする
name: fetch-issue-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download issue attachments
        run: |
          mkdir -p incoming
          i=1
          for u in 9b76aacb-b953-4f33-b6d6-e14225bcfd29 27d74d7c-77b7-4021-b6d1-931d9f05438a 1097ce0a-f38c-428a-b492-7b66c8c80cac 5ef466d4-3085-4090-90de-a817a3ab19d4 273f2fa8-0c6f-4f65-89d6-5ee649dcf18a 084e9cb4-c936-487e-823b-af281e29e149 03863cc3-9c1b-49c9-9aee-a85143f99561 7b277934-cc99-4844-8a47-d753b26ba3fd f3b21c9f-bbd2-4ac6-a3fb-9e0f2d322497 d8d8991a-35a9-4152-9a38-f49c63eb10f1 9b6596ca-a92b-45c3-9e13-17aae1f1d85b 070b6929-1250-4a87-95ed-f5f0619048da 81fd88c5-42d4-4f68-81e4-003eea94c129 e1475913-9e5f-4ae1-9a13-0f53acb71677 e4844a24-57e4-4912-9708-43019c077811 fc034b4a-026a-4135-84b9-7364013c15e1 04182ed3-49c9-4f76-8c84-f5b55ebbb7e8; do
            curl -sL "https://github.com/user-attachments/assets/$u" -o incoming/$(printf %02d $i).jpg
            i=$((i+1))
          done
          file incoming/*
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add incoming
          git commit -m "写真をIssueから取り込み [skip ci]"
          git push
