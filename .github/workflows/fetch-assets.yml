# 使い方:
#   1. このファイルを .github/workflows/fetch-assets.yml としてリポジトリにコピーする
#   2. 0df3fbba-a705-41ef-8167-a9f3bff2baa3 cef8ab71-f2b4-4dc3-b348-109a6fd19503 f0dc2f75-48c0-4322-895d-fa0f83dcf7b0 67eae312-5f66-433e-979b-39449ed16509 0eafe987-17c6-4f1a-9923-95d344de3f86 98f53139-10a1-4b64-ba29-b1a6a8424c28 ca1672cf-4ec3-4f02-b207-3b4f8c05883c 304a62a7-54b1-41e8-a19e-ef20a7ee6708 61534a12-2e25-4037-8977-4a81e9d885bc 462137b3-dd13-4c3b-99c1-55ac2cb8b090 を、Issue本文/コメントから抽出した
#      github.com/user-attachments/assets/<uuid> のUUID部分を空白区切りで並べたものに置換する
#      （例: 6e289a11-...  624c7e39-...  9764caac-...）
#   3. main にコミット＆プッシュ
#   4. mcp__github__actions_run_trigger の run_workflow で実行（workflow_id: fetch-assets.yml）
#   5. 数十秒待ってから `git pull` すると incoming/01.jpg, 02.jpg... が届く
#   6. 使い終わったら incoming/ とこのファイル自体を git rm してコミットし、後片付けする
name: fetch-issue-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download issue attachments
        run: |
          mkdir -p incoming
          i=1
          for u in 0df3fbba-a705-41ef-8167-a9f3bff2baa3 cef8ab71-f2b4-4dc3-b348-109a6fd19503 f0dc2f75-48c0-4322-895d-fa0f83dcf7b0 67eae312-5f66-433e-979b-39449ed16509 0eafe987-17c6-4f1a-9923-95d344de3f86 98f53139-10a1-4b64-ba29-b1a6a8424c28 ca1672cf-4ec3-4f02-b207-3b4f8c05883c 304a62a7-54b1-41e8-a19e-ef20a7ee6708 61534a12-2e25-4037-8977-4a81e9d885bc 462137b3-dd13-4c3b-99c1-55ac2cb8b090; do
            curl -sL "https://github.com/user-attachments/assets/$u" -o incoming/$(printf %02d $i).jpg
            i=$((i+1))
          done
          file incoming/*
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add incoming
          git commit -m "写真をIssueから取り込み [skip ci]"
          git push
