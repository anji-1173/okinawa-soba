# 使い方:
#   1. このファイルを .github/workflows/fetch-assets.yml としてリポジトリにコピーする
#   2. 96746b42-2595-43aa-80e8-d75c0e108c0c 3d80bca7-27b2-4a38-b6f7-d5bc81851492 17d31b9b-fa81-4080-9587-d5fce88da449 315cca53-4578-488e-bc77-e4efb2577597 299ad26d-10c2-41af-9a7e-86fadd0cb8b4 69138879-5f68-4628-8bd7-b2a8eaea9e7f 23dc5b03-3b9b-4771-8328-005f332609ab d8f54e80-7db3-48ef-824d-c0061a19e5ee e8c2560a-8fa9-4d0c-9963-43a0ef9d49ef aa237db3-8071-468d-89df-cd960599829d a170f7d6-95cb-4066-bfa7-bfbfe805209e を、Issue本文/コメントから抽出した
#      github.com/user-attachments/assets/<uuid> のUUID部分を空白区切りで並べたものに置換する
#      （例: 6e289a11-...  624c7e39-...  9764caac-...）
#   3. main にコミット＆プッシュ
#   4. mcp__github__actions_run_trigger の run_workflow で実行（workflow_id: fetch-assets.yml）
#   5. 数十秒待ってから `git pull` すると incoming/01.jpg, 02.jpg... が届く
#   6. 使い終わったら incoming/ とこのファイル自体を git rm してコミットし、後片付けする
name: fetch-issue-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download issue attachments
        run: |
          mkdir -p incoming
          i=1
          for u in 96746b42-2595-43aa-80e8-d75c0e108c0c 3d80bca7-27b2-4a38-b6f7-d5bc81851492 17d31b9b-fa81-4080-9587-d5fce88da449 315cca53-4578-488e-bc77-e4efb2577597 299ad26d-10c2-41af-9a7e-86fadd0cb8b4 69138879-5f68-4628-8bd7-b2a8eaea9e7f 23dc5b03-3b9b-4771-8328-005f332609ab d8f54e80-7db3-48ef-824d-c0061a19e5ee e8c2560a-8fa9-4d0c-9963-43a0ef9d49ef aa237db3-8071-468d-89df-cd960599829d a170f7d6-95cb-4066-bfa7-bfbfe805209e; do
            curl -sL "https://github.com/user-attachments/assets/$u" -o incoming/$(printf %02d $i).jpg
            i=$((i+1))
          done
          file incoming/*
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add incoming
          git commit -m "写真をIssueから取り込み [skip ci]"
          git push
