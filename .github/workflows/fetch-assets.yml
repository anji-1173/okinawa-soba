# 使い方:
#   1. このファイルを .github/workflows/fetch-assets.yml としてリポジトリにコピーする
#   2. 526c0085-b940-4e18-b4ef-690f1fad2bc3 85e9bf3d-0a1c-4da0-8fef-f78d7b5721fb 291ecf94-db52-4019-b573-492097f0434f c06af2ef-646a-4284-adc8-d510364a8e9e e9197dc6-e65a-473a-affa-c72b95022a1d eb1dca98-05a7-426d-bd9a-2d0927a7ce46 4889d0e9-3b5d-4f4d-ab86-a566d563cffc 35b36e56-090f-49f9-b432-f5463d1e623d bc2e270d-d90f-46d4-ab48-301cb75b7750 1a7645e3-6b1b-49f0-94a4-4b34907e2272 を、Issue本文/コメントから抽出した
#      github.com/user-attachments/assets/<uuid> のUUID部分を空白区切りで並べたものに置換する
#      （例: 6e289a11-...  624c7e39-...  9764caac-...）
#   3. main にコミット＆プッシュ
#   4. mcp__github__actions_run_trigger の run_workflow で実行（workflow_id: fetch-assets.yml）
#   5. 数十秒待ってから `git pull` すると incoming/01.jpg, 02.jpg... が届く
#   6. 使い終わったら incoming/ とこのファイル自体を git rm してコミットし、後片付けする
name: fetch-issue-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download issue attachments
        run: |
          mkdir -p incoming
          i=1
          for u in 526c0085-b940-4e18-b4ef-690f1fad2bc3 85e9bf3d-0a1c-4da0-8fef-f78d7b5721fb 291ecf94-db52-4019-b573-492097f0434f c06af2ef-646a-4284-adc8-d510364a8e9e e9197dc6-e65a-473a-affa-c72b95022a1d eb1dca98-05a7-426d-bd9a-2d0927a7ce46 4889d0e9-3b5d-4f4d-ab86-a566d563cffc 35b36e56-090f-49f9-b432-f5463d1e623d bc2e270d-d90f-46d4-ab48-301cb75b7750 1a7645e3-6b1b-49f0-94a4-4b34907e2272; do
            curl -sL "https://github.com/user-attachments/assets/$u" -o incoming/$(printf %02d $i).jpg
            i=$((i+1))
          done
          file incoming/*
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add incoming
          git commit -m "写真をIssueから取り込み [skip ci]"
          git push
