name: fetch-issue-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download issue attachments
        run: |
          mkdir -p incoming
          i=1
          for u in ffba493f-41ba-48b5-91a5-e9cbf599fb22 67e235f2-dde8-411b-ab00-c04656dbe34e 5b258be3-701d-4384-b42b-0fe1c9f4edd0 f9b6d2c4-2a07-40a2-a33d-b1f630b17848 7529edb5-6bd6-4f22-93ee-953ce69aaf49 593a695a-2770-4801-9a35-9926c6defd8c 7faf70e8-9d78-46b9-8e2a-33a67f23a297 a24d6e3f-1a35-4e30-adbe-031354d9c968 6c86c63c-2420-42b3-b45e-9fc409c70458 cbed2186-443e-49cd-b195-742e9f3ea53b; do
            curl -sL "https://github.com/user-attachments/assets/$u" -o incoming/$(printf %02d $i).jpg
            i=$((i+1))
          done
          file incoming/*
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add incoming
          git commit -m "パパスブ写真をIssue#1から取り込み [skip ci]"
          git push
