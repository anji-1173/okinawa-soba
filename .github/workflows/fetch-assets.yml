# 使い方:
#   1. このファイルを .github/workflows/fetch-assets.yml としてリポジトリにコピーする
#   2. c09be021-521e-4267-881f-ffb762fe89b3 40aad5f1-761d-4db3-afc7-87af1307e788 4af77f74-ad07-4a39-8e8c-e5ae4d3e7908 20c8d29b-cafb-4757-b91f-2378eaa7bab9 5d42ffdb-ec5c-4ada-a137-bab1a22b10dc ea9f011d-bb5c-4868-8b5b-acd76e4c8d1c 24d0e0a7-a0a7-4e65-9b00-8c0669cefcd9 304bc2c2-09fe-46e2-9d23-60e15ccd7c03 c5e6b527-8a72-4c22-9f29-5ce74962b28f 1831cf4c-55dd-4295-a015-5a18221d1475 415a85e9-cbac-4082-86fd-673c404d2c7a を、Issue本文/コメントから抽出した
#      github.com/user-attachments/assets/<uuid> のUUID部分を空白区切りで並べたものに置換する
#      （例: 6e289a11-...  624c7e39-...  9764caac-...）
#   3. main にコミット＆プッシュ
#   4. mcp__github__actions_run_trigger の run_workflow で実行（workflow_id: fetch-assets.yml）
#   5. 数十秒待ってから `git pull` すると incoming/01.jpg, 02.jpg... が届く
#   6. 使い終わったら incoming/ とこのファイル自体を git rm してコミットし、後片付けする
name: fetch-issue-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download issue attachments
        run: |
          mkdir -p incoming
          i=1
          for u in c09be021-521e-4267-881f-ffb762fe89b3 40aad5f1-761d-4db3-afc7-87af1307e788 4af77f74-ad07-4a39-8e8c-e5ae4d3e7908 20c8d29b-cafb-4757-b91f-2378eaa7bab9 5d42ffdb-ec5c-4ada-a137-bab1a22b10dc ea9f011d-bb5c-4868-8b5b-acd76e4c8d1c 24d0e0a7-a0a7-4e65-9b00-8c0669cefcd9 304bc2c2-09fe-46e2-9d23-60e15ccd7c03 c5e6b527-8a72-4c22-9f29-5ce74962b28f 1831cf4c-55dd-4295-a015-5a18221d1475 415a85e9-cbac-4082-86fd-673c404d2c7a; do
            curl -sL "https://github.com/user-attachments/assets/$u" -o incoming/$(printf %02d $i).jpg
            i=$((i+1))
          done
          file incoming/*
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add incoming
          git commit -m "写真をIssueから取り込み [skip ci]"
          git push
