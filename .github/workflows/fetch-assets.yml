# 使い方:
#   1. このファイルを .github/workflows/fetch-assets.yml としてリポジトリにコピーする
#   2. 6816dc6d-93df-4693-b831-3108900e8132 246d9e7b-e573-4b3f-9e47-2090c85afff8 a60b8a01-62ef-4363-9885-b0ae8d4f4dc1 7520b64e-6fb8-4032-8893-c31aa2579d1e 4cc34027-c7e6-433a-ae0d-b5969bc6db4c cbe43092-822f-4460-aed7-33a8669dc1ee 2a39a1cd-f687-434b-b47a-00abb7f19847 33eac275-64e2-4ca7-94f4-dd737b8c3e17 49a69b6b-70c3-40db-a5d1-7f0ba7db2077 9b2aaf14-dce7-4603-afee-981d44fc2ec8 b604023a-ce99-49f6-90c0-77fc0397707f 0e369cb4-b2cc-4f62-b026-8e0c1f7d790f 7eb388c3-9f74-4a98-b693-8167e523f503 を、Issue本文/コメントから抽出した
#      github.com/user-attachments/assets/<uuid> のUUID部分を空白区切りで並べたものに置換する
#      （例: 6e289a11-...  624c7e39-...  9764caac-...）
#   3. main にコミット＆プッシュ
#   4. mcp__github__actions_run_trigger の run_workflow で実行（workflow_id: fetch-assets.yml）
#   5. 数十秒待ってから `git pull` すると incoming/01.jpg, 02.jpg... が届く
#   6. 使い終わったら incoming/ とこのファイル自体を git rm してコミットし、後片付けする
name: fetch-issue-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download issue attachments
        run: |
          mkdir -p incoming
          i=1
          for u in 6816dc6d-93df-4693-b831-3108900e8132 246d9e7b-e573-4b3f-9e47-2090c85afff8 a60b8a01-62ef-4363-9885-b0ae8d4f4dc1 7520b64e-6fb8-4032-8893-c31aa2579d1e 4cc34027-c7e6-433a-ae0d-b5969bc6db4c cbe43092-822f-4460-aed7-33a8669dc1ee 2a39a1cd-f687-434b-b47a-00abb7f19847 33eac275-64e2-4ca7-94f4-dd737b8c3e17 49a69b6b-70c3-40db-a5d1-7f0ba7db2077 9b2aaf14-dce7-4603-afee-981d44fc2ec8 b604023a-ce99-49f6-90c0-77fc0397707f 0e369cb4-b2cc-4f62-b026-8e0c1f7d790f 7eb388c3-9f74-4a98-b693-8167e523f503; do
            curl -sL "https://github.com/user-attachments/assets/$u" -o incoming/$(printf %02d $i).jpg
            i=$((i+1))
          done
          file incoming/*
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add incoming
          git commit -m "写真をIssueから取り込み [skip ci]"
          git push
