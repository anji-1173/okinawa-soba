name: fetch-issue-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download issue attachments
        run: |
          mkdir -p incoming
          i=1
          for u in a1fd6f97-8b70-4b45-9b48-918c40451268 fc85da77-49f2-48f8-800e-7fc0c5c139b7 b13c5d0b-56d8-4d7b-8e65-ed11aaff0a78 e5d67c36-d714-4af9-9760-c3ed743e7d59 a757f47e-8b09-4af9-a37c-c3b2729caa4d; do
            curl -sL "https://github.com/user-attachments/assets/$u" -o incoming/$(printf %02d $i).jpg
            i=$((i+1))
          done
          file incoming/*
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add incoming
          git commit -m "美里そば写真をIssue#6から取り込み [skip ci]"
          git push
