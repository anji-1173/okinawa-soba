name: fetch-issue-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p incoming
          i=1
          for u in 00e242d9-2e0f-4d51-b0b8-cb55c934d8e7 a03b846f-e0b6-4d4f-a819-9d786dabdac7 e4e3d647-1b55-44d3-acf5-e6f0ae3ddea3 ff9f18f8-2bb3-4791-a601-7dabe04cb228 2be1c50f-1a0e-4cd9-abf7-745c59800db9 009d59cf-ef19-4e69-ab87-174102ced47c 7941992f-df4e-41c0-8da4-92a5d38e3892 12279e82-0a58-40d7-8de5-388e298d86af; do
            curl -sL "https://github.com/user-attachments/assets/$u" -o incoming/$(printf %02d $i).jpg
            i=$((i+1))
          done
          file incoming/*
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add incoming
          git commit -m "根夢写真をIssue#7から取り込み [skip ci]"
          git push
