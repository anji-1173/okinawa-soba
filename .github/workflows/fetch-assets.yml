name: fetch-issue-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download issue attachments
        run: |
          mkdir -p incoming
          i=1
          for u in 6e289a11-5725-4db9-a393-72bdc1d35390 624c7e39-eab8-4fc5-a786-7ee9f355f65c 9764caac-8e2e-477b-9c58-308763aa1728 4908916c-edc5-4389-8b00-6e7058540e56 1b3525e5-b131-4818-a1f6-fd536835f840 c1922d0c-dd07-4f51-b93f-13bcac8c69de f38edf51-7f2b-47aa-b96d-b421d12a9302 ce4d68a9-5d74-475b-96a9-afba31068c0f 5672fcf7-2de0-480a-bfab-4e0e02293bca 7f5a9a6b-1768-4f9a-9cbc-e4d48aab65fa 7c536aa6-58f8-4905-94d3-e27ee42344e8; do
            curl -sL "https://github.com/user-attachments/assets/$u" -o incoming/$(printf %02d $i).jpg
            i=$((i+1))
          done
          file incoming/*
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add incoming
          git commit -m "崎門写真をIssue#2から取り込み [skip ci]"
          git push
