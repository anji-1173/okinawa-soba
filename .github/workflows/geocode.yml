name: geocode
on: workflow_dispatch
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: query
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          UA="okinawa-soba-blog/1.0 (contact anji)"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA})
              with urllib.request.urlopen(req,timeout=60) as r: return r.read().decode()
          out={"nominatim":[]}
          qs=["花村そば 恩納村","沖縄県国頭郡恩納村瀬良垣1063-1","沖縄県国頭郡恩納村瀬良垣1063",
              "瀬良垣ビーチ 恩納村","Family Mart 瀬良垣"]
          for q in qs:
              try:
                  r=json.loads(get("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=3&countrycodes=jp&q="+urllib.parse.quote(q)))
                  for f in r:
                      out["nominatim"].append({"q":q,"name":f.get("display_name","")[:80],
                        "lat":f.get("lat"),"lng":f.get("lon"),"type":f.get("type")})
                  if not r: out["nominatim"].append({"q":q,"result":"none"})
              except Exception as e: out["nominatim"].append({"q":q,"error":str(e)})
              time.sleep(1.5)
          json.dump(out,open("geo_result.json","w"),ensure_ascii=False,indent=1)
          print("done")
          PY
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add geo_result.json
          git commit -m "nominatim 花村 [skip ci]"
          git push
