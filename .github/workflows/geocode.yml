name: geocode
on: workflow_dispatch
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: query
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          UA="okinawa-soba-blog/1.0"
          def get(url,data=None):
              req=urllib.request.Request(url,data=data,headers={"User-Agent":UA})
              with urllib.request.urlopen(req,timeout=90) as r: return r.read().decode()
          out={"gsi":[],"osm":[]}
          for q in ["沖縄県沖縄市安慶田3-7-15","沖縄県沖縄市安慶田3-7","沖縄県沖縄市安慶田三丁目"]:
              try:
                  r=json.loads(get("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+urllib.parse.quote(q)))
                  for f in r[:3]:
                      out["gsi"].append({"q":q,"title":f["properties"]["title"],
                        "lat":f["geometry"]["coordinates"][1],"lng":f["geometry"]["coordinates"][0]})
              except Exception as e: out["gsi"].append({"q":q,"error":str(e)})
              time.sleep(0.2)
          ql='[out:json][timeout:90];nwr["name"~"根夢"](26.32,127.79,26.36,127.83);out center tags;'
          try:
              j=json.loads(get("https://overpass-api.de/api/interpreter",("data="+urllib.parse.quote(ql)).encode()))
              for e in j.get("elements",[]):
                  t=e.get("tags",{})
                  out["osm"].append({"name":t.get("name"),"lat":e.get("lat") or e.get("center",{}).get("lat"),
                    "lng":e.get("lon") or e.get("center",{}).get("lon"),"amenity":t.get("amenity"),"addr":t.get("addr:full") or t.get("addr:housenumber")})
          except Exception as e: out["osm"].append({"error":str(e)})
          json.dump(out,open("geo_result.json","w"),ensure_ascii=False,indent=1)
          print("done")
          PY
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add geo_result.json
          git commit -m "geocode 根夢安慶田 [skip ci]"
          git push
