name: geocode
on: workflow_dispatch
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: query
        run: |
          rm -rf geoout && mkdir -p geoout
          UA="okinawa-soba-blog/1.0 (contact: anji_uchima@yahoo.co.jp)"
          run_ql () {
            python3 - "$2" > body.txt <<'PY'
          import sys,urllib.parse
          print("data="+urllib.parse.quote(sys.argv[1]))
          PY
            curl -s -A "$UA" -X POST --data @body.txt https://overpass-api.de/api/interpreter > geoout/$1.json
          }
          # 幸喜周辺の全POI（タグ全部）
          run_ql koki_full '[out:json][timeout:120];nwr(26.5355,127.9440,26.5430,127.9560);out center tags;'
          sleep 5
          # 美ら花（名護市全域）
          run_ql churahana '[out:json][timeout:120];area["name"="名護市"]->.a;nwr(area.a)["name"~"美ら花"];out center tags;'
          wc -c geoout/*
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -A geoout
          git commit -m "geocode results 4 [skip ci]"
          git push
