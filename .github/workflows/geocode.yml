name: geocode
on: workflow_dispatch
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: query
        run: |
          rm -rf geoout && mkdir -p geoout
          enc(){ python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$1"; }
          for q in "沖縄県名護市幸喜111-1" "沖縄県名護市幸喜111" "名護市幸喜111" "沖縄県名護市字幸喜111番地" "沖縄県沖縄市中央2-7-46" "沖縄県沖縄市中央2丁目" ; do
            echo "=== $q" >> geoout/gsi.txt
            curl -s "https://msearch.gsi.go.jp/address-search/AddressSearch?q=$(enc "$q")" >> geoout/gsi.txt
            echo "" >> geoout/gsi.txt
          done
          UA="okinawa-soba-blog/1.0"
          cat > q.ql <<'EOQ'
          [out:json][timeout:90];
          (
            nwr["name"~"美ら花|ちゅら花"](26.50,127.90,26.60,128.02);
            nwr["amenity"~"restaurant|cafe|fast_food"](26.532,127.940,26.548,127.960);
            nwr["leisure"="park"](26.530,127.940,26.548,127.960);
            nwr["name"~"幸喜"](26.520,127.930,26.560,127.990);
            nwr["highway"="bus_stop"](26.530,127.940,26.548,127.965);
          );
          out center;
          EOQ
          curl -s -A "$UA" --data-binary @q.ql https://overpass-api.de/api/interpreter > geoout/overpass_koki.json
          cat > q2.ql <<'EOQ'
          [out:json][timeout:90];
          (
            nwr["name"~"鉢巻|はちまき|侍"](26.325,127.790,26.350,127.810);
            nwr["name"~"パークアベニュー|一番街"](26.325,127.790,26.350,127.810);
            nwr["name"~"796|ナンクル"](26.325,127.790,26.350,127.810);
          );
          out center;
          EOQ
          curl -s -A "$UA" --data-binary @q2.ql https://overpass-api.de/api/interpreter > geoout/overpass_koza.json
          wc -c geoout/*
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -A geoout
          git commit -m "geocode results 2 [skip ci]"
          git push
