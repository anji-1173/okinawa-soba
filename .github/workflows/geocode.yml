name: geocode
on: workflow_dispatch
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: query
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          UA="okinawa-soba-blog/1.0"
          def get(url,data=None):
              req=urllib.request.Request(url,data=data,headers={"User-Agent":UA})
              with urllib.request.urlopen(req,timeout=110) as r: return r.read().decode()
          out={}
          # 瀬良垣の海沿い（国道58号）の飲食店・コンビニ・そば屋を面で拾う
          box="26.485,127.855,26.515,127.885"
          for tag,ql in [
            ("food",'[out:json][timeout:110];nwr["amenity"~"restaurant|fast_food|cafe"](%s);out center tags;'%box),
            ("conv",'[out:json][timeout:110];nwr["shop"="convenience"](%s);out center tags;'%box),
            ("hana",'[out:json][timeout:110];nwr["name"~"花村|そば|ソバ"](%s);out center tags;'%box),
            ("beach",'[out:json][timeout:110];nwr["name"~"瀬良垣"](26.48,127.85,26.52,127.89);out center tags;'),
          ]:
              try:
                  j=json.loads(get("https://overpass-api.de/api/interpreter",("data="+urllib.parse.quote(ql)).encode()))
                  out[tag]=[{"name":e.get("tags",{}).get("name"),
                    "lat":e.get("lat") or e.get("center",{}).get("lat"),
                    "lng":e.get("lon") or e.get("center",{}).get("lng") or e.get("center",{}).get("lon"),
                    "k":e.get("tags",{}).get("amenity") or e.get("tags",{}).get("shop") or e.get("tags",{}).get("place")} for e in j.get("elements",[])]
              except Exception as e: out[tag]=[{"error":str(e)}]
              time.sleep(2)
          json.dump(out,open("geo_result.json","w"),ensure_ascii=False,indent=1)
          print("done")
          PY
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add geo_result.json
          git commit -m "geocode 瀬良垣周辺 [skip ci]"
          git push
