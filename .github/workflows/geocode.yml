name: geocode
on: workflow_dispatch
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: round6
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          UA='okinawa-soba-blog/1.0'
          def ov(ql):
              r=urllib.request.Request('https://overpass-api.de/api/interpreter',
                    data=('data='+urllib.parse.quote(ql)).encode(), headers={'User-Agent':UA})
              try:
                  with urllib.request.urlopen(r,timeout=150) as x: return json.loads(x.read().decode())
              except Exception as e: return {'error':str(e)}
          out={}
          Q={'landmarks':'[out:json][timeout:150];nwr["name"~"ゆいゆい国頭|美ら海水族館|海洋博公園|羽地の駅|やちむん|シーサー園"](26.5,127.7,26.9,128.4);out center tags;'}
          for k,ql in Q.items():
              j=ov(ql); res=[]
              for e in j.get('elements',[]):
                  t=e.get('tags',{})
                  res.append({'name':t.get('name','(無名)'),'lat':e.get('lat') or e.get('center',{}).get('lat'),
                              'lng':e.get('lon') or e.get('center',{}).get('lon'),'k':t.get('amenity') or t.get('tourism') or t.get('shop') or ''})
              out[k]=res if res else j
              print(k,len(res),flush=True); time.sleep(3)
          json.dump(out, open('geo_round6.json','w'), ensure_ascii=False, indent=1)
          PY
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add geo_round6.json
          git commit -m "geocode round6 [skip ci]"
          git push
