name: geocode
on: workflow_dispatch
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: q
        run: |
          for q in "沖縄県沖縄市東1-23-12" "沖縄県沖縄市東1-23"; do
            echo "=== $q" >> out.txt
            curl -s "https://msearch.gsi.go.jp/address-search/AddressSearch?q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")" >> out.txt
            echo "" >> out.txt
          done
          cat out.txt
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add out.txt
          git commit -m "misato soba geocode [skip ci]"
          git push
