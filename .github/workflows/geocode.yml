name: geocode
on: workflow_dispatch
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: round5
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          UA='okinawa-soba-blog/1.0'
          def ov(ql):
              r=urllib.request.Request('https://overpass-api.de/api/interpreter',
                    data=('data='+urllib.parse.quote(ql)).encode(), headers={'User-Agent':UA})
              try:
                  with urllib.request.urlopen(r,timeout=150) as x: return json.loads(x.read().decode())
              except Exception as e: return {'error':str(e)}
          out={}
          Q={
           'izumi_food':'[out:json][timeout:150];nwr["amenity"~"restaurant|cafe|fast_food"](26.630,127.925,26.672,127.980);out center tags;',
           'izumi_bus':'[out:json][timeout:150];node["highway"="bus_stop"](26.630,127.925,26.672,127.980);out;',
           'makiya':'[out:json][timeout:150];nwr["amenity"~"restaurant|cafe|shop|marketplace"](26.620,128.020,26.655,128.055);out center tags;',
           'hanejinoeki':'[out:json][timeout:150];nwr["name"~"羽地"](26.55,127.98,26.68,128.10);out center tags;',
           'okuma':'[out:json][timeout:150];nwr["amenity"~"restaurant|cafe"](26.715,128.150,26.750,128.200);out center tags;',
           'motobusobaya':'[out:json][timeout:150];nwr["name"~"そば"](26.660,127.850,26.715,127.920);out center tags;',
          }
          for k,ql in Q.items():
              j=ov(ql); res=[]
              for e in j.get('elements',[]):
                  t=e.get('tags',{})
                  res.append({'name':t.get('name','(無名)'),'lat':e.get('lat') or e.get('center',{}).get('lat'),
                              'lng':e.get('lon') or e.get('center',{}).get('lon'),
                              'k':t.get('amenity') or t.get('highway') or t.get('shop') or ''})
              out[k]=res if res else j
              print(k, len(res), flush=True); time.sleep(4)
          json.dump(out, open('geo_round5.json','w'), ensure_ascii=False, indent=1)
          PY
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add geo_round5.json
          git commit -m "geocode round5 [skip ci]"
          git push
