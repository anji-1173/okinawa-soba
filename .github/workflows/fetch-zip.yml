name: fetch-zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download and extract (names recorded, no execution)
        run: |
          mkdir -p zipwork zipout
          curl -sL "https://github.com/user-attachments/files/34837649/x80.zip" -o zipwork/a.zip
          ls -la zipwork
          python3 -I - <<'PY'
          import zipfile, json, os
          z = zipfile.ZipFile('zipwork/a.zip')
          out = []; k = 0
          for info in z.infolist():
              raw = info.filename
              if info.flag_bits & 0x800: name = raw
              else:
                  try: name = raw.encode('cp437').decode('cp932')
                  except Exception: name = raw
              if info.is_dir(): continue
              base = name.replace('\\','/').split('/')[-1]
              if base.startswith('._') or '__MACOSX' in name: continue
              ext = os.path.splitext(base)[1].lower()
              if ext not in ('.jpg','.jpeg','.png','.heic','.mov','.mp4'):
                  out.append({'skip': name}); continue
              k += 1
              safe = 'z%02d%s' % (k, ext)
              with open('zipout/'+safe,'wb') as f: f.write(z.read(info))
              out.append({'safe': safe, 'original': name, 'size': info.file_size})
          json.dump(out, open('zipout/names.json','w'), ensure_ascii=False, indent=1)
          print(json.dumps(out, ensure_ascii=False, indent=1))
          PY
          if ls zipout/*.mov zipout/*.mp4 >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
            for v in zipout/*.mov zipout/*.mp4; do
              [ -f "$v" ] || continue
              o="${v%.*}.conv.mp4"
              ffmpeg -y -i "$v" -vf "scale='if(gt(iw,ih),-2,720)':'if(gt(iw,ih),720,-2)'" -c:v libx264 -preset slow -crf 26 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "$o"
              rm -f "$v"
            done
          fi
          ls -la zipout
          rm -rf zipwork
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add zipout
          git commit -m "zip展開 [skip ci]"
          git push
