name: fetch-zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download and extract video
        run: |
          mkdir -p zipwork zipout
          curl -sL "https://github.com/user-attachments/files/34230984/x78.zip" -o zipwork/a.zip
          python3 -I - <<'PY'
          import zipfile
          z = zipfile.ZipFile('zipwork/a.zip')
          for info in z.infolist():
              if info.filename.lower().endswith('.mov'):
                  open('zipwork/v.mov','wb').write(z.read(info)); print(info.filename, info.file_size)
          PY
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffprobe -v error -show_entries format=duration:stream=width,height,codec_name,sample_rate -of default=nw=1 zipwork/v.mov | tee zipout/video_info.txt
          ffmpeg -y -i zipwork/v.mov -vf "scale='if(gt(iw,ih),-2,720)':'if(gt(iw,ih),720,-2)'" -c:v libx264 -preset slow -crf 26 -profile:v high -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart zipout/z10.mp4
          ls -la zipout
          rm -rf zipwork
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add zipout
          git commit -m "動画変換 [skip ci]"
          git push
